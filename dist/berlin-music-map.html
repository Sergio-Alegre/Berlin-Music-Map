<title>Berlin Music Map</title>
<style id="leaflet-css">
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {

	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-image: none;

	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {

	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {

.leaflet-control-layers-expanded {

.leaflet-control-layers-scrollbar {

	overflow-x: hidden;

	}
.leaflet-control-layers-selector {
	margin-top: 2px;

	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: none;
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;

	}
.leaflet-control-attribution a {

.leaflet-control-attribution a:hover,

.leaflet-attribution-flag {

	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;

.leaflet-popup-content {

.leaflet-popup-tip-container {

.leaflet-popup-tip {

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;
	margin: 0 auto;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,

.leaflet-tooltip-right:before {

	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

	margin-bottom: -12px;

.leaflet-tooltip-bottom:before {

	margin-left: -6px;
}

}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

	margin-top: -6px;
	}

		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;

<style id="map-css">
/* Berlin Music Map: interface styles. Category colours are not written here: they come from data/categories.json. */
:root {
  --ink: #1f2933;
  --muted: #5b6770;
  --line: #d5dbe0;
  --paper: #ffffff;
  --paper-2: #f3f5f7;
  --accent: #23415f;
  --accent-ink: #ffffff;
  --focus: #0b6bcb;
  --warn: #8a4b00;
  --radius: 8px;
  --shadow: 0 2px 10px rgba(20, 30, 40, 0.28);
  --bar-h: 48px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: #e8ecef;
  overflow: hidden;
  overflow-wrap: anywhere;
}
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 0; z-index: 3000; background: #fff; padding: 6px 10px; }
.skip:focus { left: 6px; top: 6px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
[hidden] { display: none !important; }
a { color: #0b4f9c; }

/* ---------- top bar ---------- */
#topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  padding: 6px 10px; background: var(--paper); border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); position: relative; z-index: 1200;
}
#topbar h1 { margin: 0; font-size: 16px; font-weight: 700; white-space: nowrap; }
#topbar .search { flex: 1 1 220px; min-width: 0; max-width: 420px; }
#q { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); }
#count { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
#count b { color: var(--ink); }
.tools { display: flex; flex-wrap: wrap; gap: 4px; margin-left: auto; }
.tools button, .btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius);
  padding: 5px 10px; cursor: pointer; line-height: 1.2; text-decoration: none; color: var(--ink);
  display: inline-flex; align-items: center; gap: 4px;
}
.tools button:hover, .btn:hover { background: var(--paper-2); }
.tools button[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: #1a3249; }
.btn[aria-disabled="true"], .btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.badge-n { background: #e5e9ed; border-radius: 10px; padding: 0 6px; font-size: 12px; }
.tools button[aria-expanded="true"] .badge-n { background: rgba(255, 255, 255, 0.25); }

/* ---------- stage: map and panels ---------- */
#stage { position: relative; flex: 1 1 auto; min-height: 0; }
#map { position: absolute; inset: 0; background: #dfe5ea; }
.panel {
  position: absolute; z-index: 1100; background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; max-width: calc(100% - 20px);
}
.panel > header {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; position: sticky; top: 0;
  background: var(--paper); border-bottom: 1px solid var(--line); z-index: 2;
}
.panel > header h2 { margin: 0; font-size: 14px; flex: 1; }
.panel .body { padding: 8px 10px 12px; }
.panel .close { border: 0; background: transparent; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 8px; border-radius: 6px; }
.panel .close:hover { background: var(--paper-2); }
/* Desktop: two floating columns (filters on top and legend below on the left; layers on the right) */
.col { position: absolute; top: 10px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 1100; }
.col-left { left: 10px; bottom: 10px; width: 350px; max-width: calc(100% - 20px); }
.col-right { right: 10px; bottom: 100px; width: 330px; max-width: calc(100% - 20px); }
.col .panel { position: relative; pointer-events: auto; flex: 0 1 auto; min-height: 0; max-width: 100%; }
#panel-legend { margin-top: auto; min-height: 140px; }
#panel-filters { flex: 0 1 auto; min-height: 160px; }
#panel-settings { top: 0; right: 0; bottom: 0; width: 460px; border-radius: 0; max-height: none; z-index: 1150; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 8px; }

/* ---------- groups and category rows ---------- */
.group { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 8px; }
.group:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }

.only { flex: none; font-size: 11px; padding: 0 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; cursor: pointer; }
.only:hover { background: var(--paper-2); }
.line-sample { flex: none; width: 26px; height: 0; border-top: 4px solid; margin-top: 8px; opacity: 0.8; }

/* ---------- filters ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.fchip {
  border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 2px 9px; cursor: pointer; font-size: 13px;
}
.fchip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fchip b { margin-right: 3px; }
.chip-n { font-size: 11px; opacity: 0.7; font-variant-numeric: tabular-nums; }
.field { display: block; }
.field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.field input[type="text"], .field input[type="email"], .field input[type="url"], .field select, .field textarea {
  width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
}

fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 8px 0 0; padding: 6px 8px 8px; }

.tabs { display: flex; gap: 4px; margin: 4px 0 8px; }
.tabs button { border: 1px solid var(--line); background: var(--paper); padding: 3px 12px; border-radius: 14px; cursor: pointer; }

details.fold { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin-top: 8px; }

.ph-list { margin: 4px 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; font-size: 12.5px; }

/* ---------- legend: pin guide ---------- */
.legend-pins { display: grid; grid-template-columns: 38px 1fr; gap: 6px 8px; align-items: center; margin-top: 4px; }

.legend-letters { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; margin: 4px 0 0; }

.instr-legend { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; }
.instr-legend li { padding: 1px 0; }

/* ---------- map pins ---------- */
.pin-wrap, .sat-wrap { background: transparent !important; border: 0 !important; }
/* Leaflet places each icon with position:absolute and translate3d; never change this to relative (it shifts the pins) */
.pin-wrap { position: absolute; }
.pin-box { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); transform-origin: 50% 120.7%; transform: scale(var(--k, 1)); transition: transform 0.15s; }
#map.pz-1 { --k: 0.5; }
#map.pz-2 { --k: 0.65; }
#map.pz-3 { --k: 0.85; }
.pin {
  position: absolute; left: 0; top: 0; width: var(--s); height: var(--s);
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg); transform-origin: 50% 50%;
  border: 3px solid var(--c); background: var(--bg); color: var(--fg);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  display: flex; align-items: center; justify-content: center;
}
.pin.approx { border-style: dashed; }
.pin .pl { transform: rotate(45deg); font: 700 13px/1 system-ui, "Segoe UI", Arial, sans-serif; pointer-events: none; }
.pin.muni .pl { font-size: 17px; }
.pin-star {
  position: absolute; right: -7px; top: -7px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; color: #b8860b; font-size: 12px; line-height: 16px; text-align: center;
  border: 1px solid #555; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); pointer-events: none;
}
.sat {
  transform: scale(var(--k, 1)); transition: transform 0.15s;
  width: 14px; height: 14px; border-radius: 50%; border: 2px dashed var(--c); background: var(--bg);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.9);
}
.leaflet-marker-icon:focus-visible .pin, .leaflet-marker-icon:focus-visible .sat { outline: 3px solid var(--focus); outline-offset: 3px; }
.leaflet-marker-icon:focus { outline: none; }
.leaflet-marker-icon:focus-visible { outline: none; }

/* legend: the same pins, at rest inside the panel */
.demo .pin { position: relative; left: auto; top: auto; flex: none; transform: rotate(-45deg); }
.demo .pin-star { right: 2px; top: 0; }
.demo .sat { position: relative; }
.demo-wrap { position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }

.bez-label { background: transparent !important; border: 0 !important; box-shadow: none !important; color: #444; font-weight: 700; font-size: 12px; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
.leaflet-tooltip.stn { font-size: 12px; padding: 2px 6px; }
.leaflet-container { font: inherit; }

<script>
/* Email logic of the map: templates, greeting, mailto: links and .eml drafts.
 * No dependencies and no DOM access: it runs in the browser (global BMMMail) and in Node (require),
 * so scripts/test_mail.js can test it. There is no personal data in this file. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.BMMMail = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var LANGS = ["de", "en", "es", "it"];
  var LANG_NAMES = { de: "Deutsch", en: "English", es: "Español", it: "Italiano" }; // each language in its own name
  var LANG_NAMES_EN = { de: "German", en: "English", es: "Spanish", it: "Italian" };
  var VARIANTS = ["initiative", "posted"];
  var VARIANT_NAMES = { initiative: "Spontaneous application", posted: "Answer to a job ad" };

  // Names of the teaching languages, written in the language of the template
  var LANGUAGE_WORDS = {
    de: { de: "Deutsch", en: "Englisch", es: "Spanisch", it: "Italienisch" },
    en: { de: "German", en: "English", es: "Spanish", it: "Italian" },
    es: { de: "alemán", en: "inglés", es: "español", it: "italiano" },
    it: { de: "tedesco", en: "inglese", es: "spagnolo", it: "italiano" },
  };
  var AND = { de: "und", en: "and", es: "y", it: "e" };

  function languageList(codes, lang) {
    var words = LANGUAGE_WORDS[lang] || LANGUAGE_WORDS.de;
    var list = LANGS.filter(function (c) { return (codes || []).indexOf(c) >= 0; }).map(function (c) { return words[c]; });
    if (list.length === 0) return "";
    if (list.length === 1) return list[0];
    var and = AND[lang] || "und";
    if (lang === "es" && /^(i|hi)/i.test(list[list.length - 1])) and = "e";
    return list.slice(0, -1).join(", ") + " " + and + " " + list[list.length - 1];
  }

  /* Entity name for the greeting and the text, without a clarifying parenthesis at the end. */
  function cleanName(name) {
    var n = String(name || "").trim();
    var m = n.match(/^(.{6,}?)\s*\([^()]*\)$/);
    return m ? m[1].trim() : n;
  }

  /* The data has no names of people, so the greeting always addresses the team of the entity. */
  function greeting(entity, lang) {
    var name = cleanName(entity && entity.name);
    switch (lang) {
      case "en": return "Dear " + name + " team,";
      case "es": return "Estimado equipo de " + name + ":";
      case "it": return "Gentile team di " + name + ",";
      default: return "Sehr geehrtes Team von " + name + ",";
    }
  }

  /* What the sender offers, by category of the entity ({{role}}). It reads after "in the area of" / "im Bereich". */
  function rolePhrase(entity, lang, instrument) {
    var cat = (entity && entity.category) || "";

    var T = {
      music: {
        de: i ? "Unterricht in " + i : "Musikunterricht",
        en: i ? i + " teaching" : "music teaching",
        es: i ? "clases de " + i : "clases de música",

        it: "lezioni di pianoforte",

        it: "lezioni di strumenti a fiato e ottoni",

      EDU: {
        de: "Instrumentalunterricht an Schulen",

      ENS: {
        de: "Registerproben und Ensemblearbeit",
        en: "section coaching and ensemble work",

      OUT: {

        it: "educazione e mediazione musicale",

      CHO: {
        de: "Gesangs- und Chorunterricht",
        en: "singing and choir teaching",
        es: "clases de canto y coro",
        it: "insegnamento di canto e coro",
      },
    };
    // MUN and PRV (and any unknown category) use the instrument typed in the settings
    var key = T[cat] ? cat : "music";
    return T[key][lang] || T[key].de;
  }

  var ATTACHED_LINE = {

    es: {

        subject: "Candidatura espontánea: {{role}} – {{my_name}}",
        body: [
          "{{greeting}}",

  /* ---------- public transport ---------- */

    }

    var general = h("fieldset", null, [h("legend", { text: "About you" })]);
    general.appendChild(textField("Your name", function () { return settings.name; }, function (v) { settings.name = v; }).node);
    general.appendChild(textField("Your email address (sender of the .eml draft)", function () { return settings.email; }, function (v) { settings.email = v; }, { type: "email" }).node);
    var langs = h("fieldset", null, [h("legend", { text: "Languages you teach in" })]);
    var lrow = h("div", { class: "row" });
    LANG_OPTIONS.forEach(function (l) {
      var cb = h("input", { type: "checkbox" });
      cb.checked = settings.teachingLanguages.indexOf(l[0]) >= 0;
      cb.addEventListener("change", function () {
        var set = settings.teachingLanguages.filter(function (x) { return x !== l[0]; });
        if (cb.checked) set.push(l[0]);
        settings.teachingLanguages = set;
        persist();
      });
      lrow.appendChild(h("label", { class: "row" }, [cb, document.createTextNode(l[1])]));
    });
    langs.appendChild(lrow);
    general.appendChild(langs);
    general.appendChild(textField("Signature", function () { return settings.signature; }, function (v) { settings.signature = v; }, { area: true, rows: 3 }).node);
    general.appendChild(textField("Link to your CV (optional)", function () { return settings.cvLink; }, function (v) { settings.cvLink = v.trim(); }, { type: "url", placeholder: "https://…" }).node);
    // CV file
    var cvStatus = h("div", { class: "hint", role: "status" });
    var cvInput = h("input", { type: "file", accept: "application/pdf,.pdf", id: "cv-file" });
    function showCv() {
      cvStore.get().then(function (rec) {
        cvStatus.textContent = rec && rec.name
          ? (rec.volatile ? "Kept in memory until you close this page: " : "Stored in this browser: ") + rec.name + " (" + Math.round((rec.size || 0) / 1024) + " KB). It is used only for the .eml draft."
          : "No CV file chosen. The .eml draft will have no attachment.";
      });
    }
    cvInput.addEventListener("change", function () {
      var f = cvInput.files && cvInput.files[0];
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { toast("That file is larger than 8 MB. Choose a smaller PDF."); return; }
      var rd = new FileReader();
      rd.onload = function () {
        cvStore.put({ name: f.name, type: f.type || "application/pdf", size: f.size, data: rd.result }).then(function (ok) {
          showCv();
          toast(ok ? "CV file stored in this browser." : "Your browser would not store the file, so it is kept only until you close or reload this page.");
        });
      };
      rd.onerror = function () { toast("Could not read that file."); };
      rd.readAsArrayBuffer(f);
    });
    general.appendChild(h("div", { class: "field" }, [h("span", { text: "CV file (PDF, attached to the .eml draft)" }), cvInput]));
    general.appendChild(cvStatus);
    general.appendChild(h("button", { type: "button", class: "btn small", text: "Remove CV file", onclick: function () { cvStore.del().then(function () { cvInput.value = ""; showCv(); }); } }));
    showCv();
    stack.appendChild(general);

    // texts by language
    var texts = h("fieldset", null, [h("legend", { text: "Email texts" })]);
    var tabs = h("div", { class: "tabs", role: "tablist", "aria-label": "Language of the email text" });
    var area = h("div");
    function renderTabs() {
      clear(tabs);
      Mail.LANGS.forEach(function (l) {
        var b = h("button", { type: "button", role: "tab", "aria-selected": l === tabLang ? "true" : "false", text: Mail.LANG_NAMES[l] });
        b.addEventListener("click", function () { tabLang = l; renderTabs(); renderArea(); updatePreview(); });
        tabs.appendChild(b);
      });
    }
    function renderArea() {
      clear(area);
      var ln = Mail.LANG_NAMES_EN[tabLang];
      area.appendChild(textField("Instrument or subject, as written in " + ln + " emails", function () { return settings.instrument[tabLang]; }, function (v) { settings.instrument[tabLang] = v; }, { placeholder: INSTRUMENT_EXAMPLES[tabLang] }).node);
      area.appendChild(textField("Short bio for " + ln + " emails (one or two sentences)", function () { return settings.bio[tabLang]; }, function (v) { settings.bio[tabLang] = v; }, { area: true, rows: 3 }).node);
      var vt = h("div", { class: "tabs", role: "tablist", "aria-label": "Kind of email" });
      Mail.VARIANTS.forEach(function (v) {
        var b = h("button", { type: "button", role: "tab", "aria-selected": v === tabVariant ? "true" : "false", text: Mail.VARIANT_NAMES[v] });
        b.addEventListener("click", function () { tabVariant = v; renderArea(); updatePreview(); });
        vt.appendChild(b);
      });
      area.appendChild(vt);
      var t = settings.templates[tabLang][tabVariant];
      var sub = textField("Subject", function () { return t.subject; }, function (v) { t.subject = v; });
      var bod = textField("Message", function () { return t.body; }, function (v) { t.body = v; }, { area: true, code: true, rows: 12 });
      area.appendChild(sub.node);
      area.appendChild(bod.node);
      area.appendChild(h("button", { type: "button", class: "btn small", text: "Restore the default text", onclick: function () {
        var def = Mail.DEFAULT_TEMPLATES[tabLang][tabVariant];
        t.subject = def.subject; t.body = def.body;
        sub.input.value = def.subject; bod.input.value = def.body;
        persist();
      } }));
    }
    texts.appendChild(tabs);
    texts.appendChild(area);
    var help = h("details", { class: "fold" }, [h("summary", { text: "Placeholders you can use in the texts" })]);
    var hl = h("dl", { class: "ph-list" });
    PLACEHOLDER_HELP.forEach(function (p) { hl.appendChild(h("dt", null, [h("code", { text: p[0] })])); hl.appendChild(h("dd", { text: p[1] })); });
    help.appendChild(hl);
    help.appendChild(h("p", { class: "hint", text: "A line whose placeholder is empty is left out of the email." }));
    texts.appendChild(help);
    stack.appendChild(texts);

    // preview
    var prevSel = h("select", { "aria-label": "Place for the preview" }, entities.slice().sort(function (a, b) { return a.d.name.localeCompare(b.d.name); }).map(function (e) {
      return h("option", { value: e.d.id, text: e.d.name });
    }));
    var prevOut = h("pre", { class: "preview", "aria-live": "polite" });
    prevSel.addEventListener("change", function () { previewId = prevSel.value; updatePreview(); });
    function updatePreview() {
      var e = entities.filter(function (x) { return x.d.id === (previewId || prevSel.value); })[0] || entities[0];
      if (!e) { prevOut.textContent = "There are no places to preview."; return; }
      var msg = Mail.compose(e.d, settings, { lang: tabLang, variant: tabVariant });
      prevOut.textContent = plainMessage(msg);
    }
    stack.appendChild(h("details", { class: "fold", open: true }, [
      h("summary", { text: "Preview with a real place" }),
      h("label", { class: "field" }, [h("span", { text: "Place" }), prevSel]),
      prevOut,
    ]));

    // export / import
    var imp = h("input", { type: "file", accept: "application/json,.json", class: "sr-only", id: "import-file", tabindex: "-1" });
    imp.addEventListener("change", function () {
      var f = imp.files && imp.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var obj = JSON.parse(rd.result);
          var src = obj && obj.settings ? obj.settings : obj;
          settings = Mail.normalizeSettings(src);
          store.set(SETTINGS_KEY, settings);
          rebuild();
          toast("Settings imported.");
        } catch (err) { toast("That file is not a valid settings export."); }
      };
      rd.readAsText(f);
      imp.value = "";
    });
    stack.appendChild(h("div", { class: "row" }, [
      h("button", { type: "button", class: "btn", text: "Export settings", onclick: function () {
        var payload = { app: "berlin-music-map", version: 1, exported: today(), settings: settings, note: "The CV file itself is not included." };
        downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), "berlin-music-map-settings.json");
      } }),
      h("button", { type: "button", class: "btn", text: "Import settings", onclick: function () { imp.click(); } }),
      h("button", { type: "button", class: "btn", text: "Clear all settings", onclick: function () {
        openDialog("Clear all settings?", [h("p", { text: "Your name, signature and email texts will be cleared and the default templates restored. A stored CV file is kept." })], [
          { text: "Clear settings", primary: true, run: function () { settings = Mail.normalizeSettings(null); store.set(SETTINGS_KEY, settings); rebuild(); toast("Settings cleared."); } },
          { text: "Cancel" },
        ]);
      } }),
      imp,
    ]));

    function rebuild() { buildSettings(); }
    renderTabs();
    renderArea();
    body.appendChild(stack);
    updatePreview();
  }

  /* ====================== start-up ====================== */
  function init() {
    buildSettings();
    syncFilterUI();
    $$("input[data-transit]").forEach(function (cb) { cb.checked = !!view.transit[cb.getAttribute("data-transit")]; });
    $$("input[data-boundaries]").forEach(function (cb) { cb.checked = view.boundaries; });
    $$("input[data-base]").forEach(function (r) { r.checked = r.getAttribute("data-base") === view.base; });
    setBase(view.base);
    ["bus", "tram", "S", "U"].forEach(function (m) { if (view.transit[m]) map.addLayer(transitGroups[m]); });
    updateTransitWeights();
    updateStations();
    setPinScale();
    if (view.boundaries) map.addLayer(boundaryLayer);
    applyFilters();
    var pts = entities.map(function (e) { return [e.d.geo.lat, e.d.geo.lng]; });
    if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [24, 24] });
    var w = window.innerWidth, hgt = window.innerHeight;
    if (w >= 900) setPanel("layers", true, true);
    if (w >= 1200 && hgt >= 760) setPanel("legend", true, true);
    // hooks for scripts/smoke_map.js
    window.__bmm = { transitGroups: transitGroups, boundaryLayer: boundaryLayer, map: map, entities: entities, view: view, applyFilters: applyFilters, setOnly: setOnly, showAll: showAll, setTransit: setTransit, settings: function () { return settings; }, counts: counts, instrCounts: instrCounts, transitCounts: transitCounts };
  }
  init();
})();

</script>
</body>
</html>
