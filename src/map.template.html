<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berlin Music Map</title>
<style id="leaflet-css">
<!--@@LEAFLET_CSS@@-->
</style>
<style id="map-css">
<!--@@MAP_CSS@@-->
</style>
</head>
<body>
<a class="skip" href="#map">Skip to the map</a>
<div id="app">
  <header id="topbar">
    <h1>Berlin Music Map</h1>
    <div class="search">
      <label class="sr-only" for="q">Search places</label>
      <input id="q" type="search" placeholder="Search name, district, address, instrument…" autocomplete="off">
    </div>
    <div id="count" role="status" aria-live="polite"></div>
    <nav class="tools" aria-label="Panels">
      <button type="button" data-panel="layers" aria-expanded="false" aria-controls="panel-layers">Layers</button>
      <button type="button" data-panel="filters" aria-expanded="false" aria-controls="panel-filters">Filters</button>
      <button type="button" data-panel="legend" aria-expanded="false" aria-controls="panel-legend">Legend</button>
      <button type="button" data-panel="settings" aria-expanded="false" aria-controls="panel-settings">Settings</button>
    </nav>
  </header>
  <div id="stage">

    <div class="col col-left">
      <section class="panel" id="panel-filters" aria-label="Filters" hidden>
        <header><h2>Filters</h2><button type="button" class="close" aria-label="Close filters">&times;</button></header>
        <div class="body"></div>
      </section>
      <section class="panel" id="panel-legend" aria-label="Legend" hidden>
        <header><h2>Legend</h2><button type="button" class="close" aria-label="Close legend">&times;</button></header>
        <div class="body"></div>
      </section>
    </div>
    <div class="col col-right">
      <section class="panel" id="panel-layers" aria-label="Layers" hidden>
        <header><h2>Layers</h2><button type="button" class="close" aria-label="Close layers">&times;</button></header>
        <div class="body"></div>
      </section>
    </div>
    <section class="panel" id="panel-settings" aria-label="Settings" hidden>
      <header><h2>Settings</h2><button type="button" class="close" aria-label="Close settings">&times;</button></header>
      <div class="body"></div>
    </section>
    <!-- The map comes after the panels so that keyboard users reach the controls first. -->
    <div id="map" role="application" aria-label="Map of places in Berlin where music is taught" tabindex="-1"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="dialog-back" hidden>
  <div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></div>
</div>
<noscript><p style="padding:16px">This map needs JavaScript.</p></noscript>

<script type="application/json" id="data-categories"><!--@@DATA_CATEGORIES@@--></script>
<script type="application/json" id="data-instruments"><!--@@DATA_INSTRUMENTS@@--></script>
<script type="application/json" id="data-jobs"><!--@@DATA_JOBS@@--></script>
<script type="application/json" id="data-districts"><!--@@DATA_DISTRICTS@@--></script>
<script type="application/json" id="data-transit"><!--@@DATA_TRANSIT@@--></script>
<script type="application/json" id="data-meta"><!--@@DATA_META@@--></script>
<script>
<!--@@LEAFLET_JS@@-->
</script>
<script>
<!--@@MAIL_JS@@-->
</script>
<script>
<!--@@MAP_JS@@-->
</script>
</body>
</html>
